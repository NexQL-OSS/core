name: Publish Extension (Stable)

permissions:
  contents: write

env:
  VSCE_VERSION: '2.24.0'
  EXTENSION_NAME: postgres-explorer

on:
  push:
    tags:
      # Digit after v so `vv0.1.5` does not match. The job still requires
      # exactly vMAJOR.MINOR.PATCH.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to republish (2.4.0 or v2.4.0). Must match an existing tag. Do not pass vv2.4.0.'
        required: true
        type: string

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        id: release
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          RAW="$RAW_VERSION"
          if [[ "$RAW" == vv* ]]; then
            printf '::error::Refusing %s. A second v was prefixed onto a version that already had one. Use 2.4.0 or v2.4.0. Tags are vMAJOR.MINOR.PATCH, never vvMAJOR.MINOR.PATCH.\n' "$RAW"
            exit 1
          fi
          if [[ "$RAW" == v* ]]; then
            VERSION="${RAW#v}"
          else
            VERSION="$RAW"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::Version must be MAJOR.MINOR.PATCH with at most one leading v. Got %s.\n' "$RAW"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing stable release v${VERSION}"

      # Keep the guard from this workflow's commit. A republish checks out an
      # older tag that does not contain the script.
      - name: Checkout workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preserve version guard
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/version-guard"
          cp scripts/check-release-version.js scripts/compute-nightly-version.js "$RUNNER_TEMP/version-guard/"

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify tag, package.json, lockfile, and CHANGELOG
        env:
          RELEASE_TAG: ${{ steps.release.outputs.ref }}
        run: node "$RUNNER_TEMP/version-guard/check-release-version.js" --tag "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: make package

      - name: Resolve VSIX path
        id: vsix
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          VSIX_FILE="${EXTENSION_NAME}-${VERSION}.vsix"
          if [ ! -f "$VSIX_FILE" ]; then
            echo "::error::Expected VSIX not found: $VSIX_FILE"
            ls -la *.vsix 2>/dev/null || true
            exit 1
          fi
          echo "path=${VSIX_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-stable-${{ steps.release.outputs.version }}
          path: ${{ steps.vsix.outputs.path }}
          retention-days: 90

      - name: Publish to VS Code Marketplace
        run: |
          npx -y "@vscode/vsce@${VSCE_VERSION}" publish \
            --packagePath "${{ steps.vsix.outputs.path }}" \
            -p "${{ secrets.VSCE_PAT }}"

      - name: Publish to Open VSX Registry
        run: |
          npx -y ovsx publish "${{ steps.vsix.outputs.path }}" \
            -p "${{ secrets.OVSX_PAT }}"

      - name: Extract CHANGELOG section
        id: changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::CHANGELOG.md has no notes under ## [${VERSION}]. Refusing to publish."
            exit 1
          fi
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (from CHANGELOG)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.ref }}
          name: ${{ steps.release.outputs.ref }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: ${{ steps.vsix.outputs.path }}
          draft: false
          prerelease: false
