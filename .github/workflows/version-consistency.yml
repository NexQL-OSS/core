name: Version consistency

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: package.json, lockfile, and CHANGELOG agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fail if the stable version sources disagree
        run: node scripts/check-release-version.js
